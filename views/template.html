<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>European Sleeper · Operations Decision Support</title>
<style>
/* Look after Shaun Doraiyah's Nightdesk console sketch: light ground, ink borders, mono labels,
   colour only for status and never as the only signal. Runs offline; system fonts as fallback. */
:root{--ink:#1A0A14;--aub:#40002C;--aub-2:#5A0C40;--ground:#EDEFF3;--panel:#FFFFFF;--rule:rgba(43,27,38,.22);
--rule-strong:#2B1B26;--muted:#4A3A45;--warn:#C81E1E;--warn-tint:#FBE9E9;--caut:#F2A900;--caut-tint:#FFF6DB;
--adv:#475569;--adv-tint:#E2E8F0;--go:#15803D;--go-tint:#E7F4EC;--on-aub:#F3E6EF;--on-aub-dim:#D9BFD0;
--hatch:repeating-linear-gradient(135deg,#E4E6EB 0 6px,#F7F8FA 6px 12px);
--mono:"Source Code Pro",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
--sans:"Source Sans 3","Source Sans Pro",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.35 var(--sans)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #0B57D0;outline-offset:2px}
.lab{font:700 11px var(--mono);letter-spacing:.09em;text-transform:uppercase}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* header */
.hdr{background:var(--aub);color:var(--on-aub);display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;
padding:9px 18px;border-bottom:4px solid var(--ink)}
.brand b{display:block;font:800 15px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.brand span{display:block;font-size:13px;color:var(--on-aub-dim);margin-top:2px}
.clock{text-align:center}
.clock .t{font:800 40px/1 var(--mono);letter-spacing:.02em}
.clock .d{font:700 11px var(--mono);letter-spacing:.09em;color:var(--on-aub-dim);margin-top:3px;text-transform:uppercase}
.next{justify-self:end;border:2px solid var(--on-aub);padding:6px 12px;border-radius:2px;text-align:right;min-width:270px}
.next .k{font:700 11px var(--mono);letter-spacing:.09em;color:var(--on-aub-dim);text-transform:uppercase}
.next .v{font:800 26px/1.1 var(--mono)}
.next.late{background:var(--warn);border-color:#fff}
.next.done{background:var(--aub-2)}
.replay{background:var(--ink);color:#fff;font:700 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;
padding:4px 18px;display:flex;justify-content:space-between;gap:12px}

/* alarm bar */
.master{display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--warn);color:#fff;border-bottom:2px solid var(--ink)}
.master.acked{background:var(--panel);color:var(--ink)}
.master .tier{font:800 13px var(--mono);letter-spacing:.08em;white-space:nowrap}
.master .msg{flex:1;font-size:16px;font-weight:600}
.master .src{font:600 11px var(--mono);color:inherit;opacity:.9}
.master button{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:2px;font:800 12px var(--mono);
letter-spacing:.08em;padding:5px 12px}
@keyframes blink{50%{background:#8E1414}}
.master:not(.acked){animation:blink 1.6s steps(1) infinite}

/* workflow strip */
.flow{display:flex;gap:0;padding:0 18px;background:#F4F5F8;border-bottom:2px solid var(--ink)}
.flow button{flex:1;background:none;border:0;border-right:1px solid var(--rule);padding:7px 10px;text-align:left;
font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flow button:last-child{border-right:0}
.flow button b{display:inline-block;width:20px;height:20px;line-height:17px;text-align:center;border:2px solid currentColor;
border-radius:50%;margin-right:8px}
.flow button.on{background:var(--ink);color:#fff}
.flow button.past{color:var(--ink)}

/* fleet strip */
.fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;padding:10px 18px 0}
.fc{background:var(--panel);border:2px solid var(--ink);border-left-width:10px;border-radius:2px;padding:6px 10px;min-width:0}
.fc.w{border-left-color:var(--warn)}.fc.c{border-left-color:var(--caut)}.fc.a{border-left-color:var(--adv)}.fc.n{border-left-color:var(--go)}
.fc .no{font:800 24px/1 var(--mono)}
.fc .rt{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .tm{font:600 12px var(--mono);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.st{font:800 11px var(--mono);letter-spacing:.06em;padding:2px 6px;border-radius:2px;border:1.5px solid var(--ink);white-space:nowrap}
.st.w{background:var(--warn);color:#fff}.st.c{background:var(--caut)}.st.a{background:var(--adv-tint)}.st.n{background:var(--go-tint)}
.st.x{background:var(--hatch);border-style:dashed}

/* main grid */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:10px;padding:10px 18px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:2px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#F4F5F8;
border-bottom:2px solid var(--ink);padding:5px 10px}
.panel>header h2{margin:0;font:800 12px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.panel .body{padding:10px}
.more{background:none;border:0;border-bottom:2px solid var(--ink);padding:0;font:800 11px var(--mono);letter-spacing:.08em;
text-transform:uppercase;color:var(--ink)}
.more:hover{background:var(--caut-tint)}
.hl{box-shadow:0 0 0 4px #0B57D0}

.trow{display:grid;grid-template-columns:minmax(0,auto) minmax(420px,1fr)}
.train{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:8px 14px;border-right:2px solid var(--ink)}
.train .no{font:800 50px/1 var(--mono)}
.train .rt{font-size:19px;font-weight:700}
.train .sub{font-size:13px;color:var(--muted)}
.tele{display:grid;grid-template-columns:repeat(3,1fr)}
.tele div{padding:7px 12px;border-right:1px solid var(--rule)}
.tele div:last-child{border-right:0}
.tele .v{font:800 24px/1.1 var(--mono)}
.tele .crit .v{color:var(--warn)}
.tele .s{font:600 11px var(--mono);color:var(--muted)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:10px}
#map{display:block;width:100%;height:270px}
.cons{display:flex;gap:4px;padding:8px 10px;overflow-x:auto}
.cc{flex:1 1 0;min-width:84px;border:2px solid var(--ink);border-radius:2px;padding:4px 6px;background:var(--panel);border-top-width:7px}
.cc .n{font:800 14px var(--mono);white-space:nowrap}.cc .t{font:600 10.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc .p{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .f{font:800 10px var(--mono);letter-spacing:.04em;margin-top:2px;min-height:12px}
.cc.w{border-color:var(--warn);background:#FDECEC}.cc.w .f{color:var(--warn)}.cc.c{border-top-color:var(--caut)}.cc.u{border-style:dashed}
.cc.out{opacity:.55}.cc.out .n{text-decoration:line-through}
.saves{font:800 11px var(--mono);color:var(--go)}
#td{display:block;width:100%;height:300px}
#td text{font:700 10.5px var(--mono);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
#rules{border-top:2px solid var(--ink)}
.lbl-t{font:600 12px var(--sans);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.tag-t{font:800 11px var(--mono);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 10px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--ink);vertical-align:middle;margin-right:5px}

.board{display:grid;grid-template-columns:repeat(3,1fr)}
.cell{padding:8px 10px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:none;border-top:0;border-left:0;
text-align:left;color:var(--ink);min-width:0;display:flex;flex-direction:column;gap:4px}
.cell:nth-child(3n){border-right:0}
.cell:hover{background:#F7F8FA}
.cell .net{font:800 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.verdict{font:800 13px var(--mono);letter-spacing:.04em;padding:3px 7px;border:2px solid var(--ink);border-radius:2px;align-self:flex-start}
.v-go{background:var(--go);color:#fff}.v-no{background:var(--warn);color:#fff}.v-ca{background:var(--caut)}
.v-na{background:var(--hatch);border-style:dashed}
.cell .note{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.evl{font:600 10.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-top:2px solid var(--ink);
font:700 12px var(--mono)}
.callout{font:800 12px var(--mono);letter-spacing:.06em;padding:4px 8px;border:2px solid var(--ink);border-radius:2px;background:var(--caut-tint)}
.callout.done{background:var(--go);color:#fff}

/* planner's call */
.opt-r{display:grid;grid-template-columns:auto 1fr auto;gap:1px 8px;align-items:start;padding:5px 10px;border-bottom:1px solid var(--rule)}
.opt-r.sel{background:var(--caut-tint);box-shadow:inset 5px 0 0 var(--ink)}
.opt-r.off{background:#F7F8FA;color:var(--muted)}
.opt-r input{margin-top:3px;accent-color:var(--ink);width:16px;height:16px}
.opt-r .ttl{font-weight:600;font-size:14px;line-height:1.25}
.opt-r .eur{font:800 16px var(--mono);text-align:right;white-space:nowrap}
.opt-r .meta{grid-column:2 / 4;font:600 11px var(--mono);color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tagb{white-space:nowrap;align-self:start;font:800 10px var(--mono);letter-spacing:.06em;padding:1px 5px;border:1.5px solid var(--ink);border-radius:2px;color:var(--ink)}
.tagb.g{background:var(--go-tint)}.tagb.c{background:var(--caut)}.tagb.w{background:var(--warn);color:#fff}.tagb.x{background:var(--hatch);border-style:dashed}
.why{padding:8px 10px;border-bottom:1px solid var(--rule)}
.why textarea{width:100%;height:32px;resize:none;border:2px solid var(--ink);border-radius:2px;padding:5px 7px;font:14px var(--sans)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.quick button{background:#fff;border:1.5px solid var(--ink);border-radius:2px;font:600 12px var(--sans);padding:2px 8px}
.armrow{display:flex;gap:8px;padding:9px 10px;align-items:center}
.arm{flex:1;background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:2px;font:800 14px var(--mono);letter-spacing:.1em;padding:9px}
.arm.armed{background:var(--warn);border-color:var(--ink)}
.arm:disabled{background:#B8BCC6;border-color:#B8BCC6;cursor:default}
.ghost{background:#fff;border:2px solid var(--ink);border-radius:2px;font:800 12px var(--mono);letter-spacing:.06em;padding:8px 10px}
.hint{font-size:12px;color:var(--muted);padding:0 10px 8px}
.rec{margin:10px;border:3px solid var(--go);border-radius:2px;padding:8px 10px;background:var(--go-tint)}
.rec .stamp{font:800 18px var(--mono);letter-spacing:.14em;color:var(--go)}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:13px}
.rec dt{font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rec dd{margin:0;overflow-wrap:anywhere}
.sent{padding:0 10px 10px}
.confcell{display:flex;gap:6px;align-items:start;flex-wrap:wrap;justify-content:flex-end}
button.mini{font:800 10px var(--mono);letter-spacing:.06em;padding:1px 6px;border:1.5px solid var(--ink);border-radius:2px;background:var(--ink);color:#fff;cursor:pointer}
.outst{font-size:12px;padding:6px 0 0;border-top:1px solid var(--rule)}
.sent .m{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;padding:5px 0;border-top:1px solid var(--rule);font-size:13px}
.rule{padding:7px 10px;border-bottom:1px solid var(--rule);font-size:13px}
.rule .id{font:800 11px var(--mono);letter-spacing:.06em;margin-right:6px}
.rule q{display:block;color:var(--muted);margin-top:2px;font-size:12px}
.norule{margin:10px;padding:8px 10px;background:var(--hatch);border:2px dashed var(--ink);font:700 12px var(--mono)}
.log{height:178px;overflow:auto}
#rules{max-height:178px;overflow:auto}
.log .r{display:grid;grid-template-columns:62px 74px 1fr;gap:8px;padding:4px 10px;border-bottom:1px solid var(--rule);font-size:13px}
.log .r.new{background:var(--caut-tint)}
.log .tm{font:700 12px var(--mono)}
.log .kd{font:800 10.5px var(--mono);letter-spacing:.06em;padding-top:1px}
.foot{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding:8px 18px;border-top:2px solid var(--ink);
background:var(--panel);font:600 11.5px var(--mono)}
.foot .ok{color:var(--go);font-weight:800}
.foot button{background:#fff;border:2px solid var(--ink);border-radius:2px;font:800 11px var(--mono);padding:3px 8px}

/* detail pages */
#page{display:none;position:fixed;inset:0;background:var(--ground);overflow:auto;z-index:10}
#page.on{display:block}
.pbar{position:sticky;top:0;background:var(--aub);color:var(--on-aub);display:flex;gap:16px;align-items:center;padding:10px 18px;
border-bottom:4px solid var(--ink);z-index:1}
.pbar button{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:2px;font:800 12px var(--mono);letter-spacing:.08em;padding:6px 12px}
.pbar h1{margin:0;font:800 16px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.pbar nav{margin-left:auto;display:flex;gap:6px}
.pbody{max-width:1180px;margin:0 auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:12px}
.pbody h2{font-size:26px;margin:4px 0 0}
.pbody .lede{font-size:17px;margin:0;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:800 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:left;background:#F4F5F8;border-bottom:2px solid var(--ink);padding:5px 10px}
td{padding:5px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
td.src,span.src{font:600 12px var(--mono);color:var(--muted)}
.fact{padding:6px 10px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr minmax(180px,34%);gap:14px;font-size:14px}
.fact .src{font:600 12px var(--mono);color:var(--muted)}
pre{margin:0;padding:10px;font:13px/1.45 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font:800 30px/1.15 var(--sans)}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}.two,.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="page" role="dialog" aria-modal="true"></div>
<script id="data" type="application/json">/*__RELAY_DATA__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const NS = "http://www.w3.org/2000/svg";
const AXES = [["rules","Rules"],["products","Products"],["partners","Partners"],["infrastructure","Infrastructure"],["time","Time"],["money","Money"]];
const FLOW = [["Incident","sec-receive"],["Impact","sec-affected"],["Options","sec-actions"],["Decision","sec-decide"],["Record","sec-proof"]];
const NET = D.network || {places:{},lines:{}}, PL = NET.places || {}, LINES = NET.lines || {};
const LIVE = D.live || null, INC = D.incident || {};
const LABELS = {BRU:{dx:8,dy:16,a:"start"}, DDL:{dx:-8,dy:-7,a:"end"}, HBTH:{dx:-8,dy:-8,a:"end"}, ELEN:{dx:9,dy:-7,a:"start"},
  EMSTG:{dx:-8,dy:15,a:"end"}, BER:{dx:8,dy:-7,a:"start"}, PRG:{dx:0,dy:18,a:"middle"}, PAR:{dx:0,dy:18,a:"middle"},
  KAR:{dx:-9,dy:4,a:"end"}, CRA:{dx:9,dy:4,a:"start"}, MIL:{dx:9,dy:4,a:"start"}, AMS:{dx:-8,dy:-6,a:"end"}};
const S = {sel:D.chosen, recorded:null, conf:{}, armed:0, armTimer:null, flow:0, acked:false, replay:false, departed:null, log:[]};

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(3)){ if (c == null || c === false) continue; e.append(c.nodeType ? c : String(c)); }
  return e;
}
function s(tag, attrs, ...kids){
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs||{})){ if (v != null) e.setAttribute(k, v); }
  for (const c of kids.flat()){ if (c == null) continue; e.append(c.nodeType ? c : String(c)); }
  return e;
}
const arr = x => Array.isArray(x) ? x : [];
const eur = n => n == null ? "not priced" : "€" + Number(n).toLocaleString("en-GB");
const shortName = k => PL[k] ? String(PL[k].name).replace(/\s*\(.*\)\s*$/, "") : (k || "");
const optById = id => arr(D.options).find(o => o.id === id);
const pad = n => String(n).padStart(2, "0");
/* A fact reads "statement — source". Split at the last dash. */
function splitFact(f){ const i = String(f).lastIndexOf(" — "); return i < 0 ? [String(f), ""] : [f.slice(0, i), f.slice(i + 3)]; }
function panel(title, right, ...kids){ return h("section", {class:"panel"}, h("header", {}, h("h2", {text:title}), right), kids); }
function tidy(t){ return String(t || "").replace(/(\d+) ([\w ]+?)\(s\)/g, (m, n, w) => n + " " + w + (n === "1" ? "" : "s")).replace(/^In train, not commercial loses a car$/, "1 car out of the train").replace(/ loses a car$/, " · 1 car lost").replace(/\b1 (shunting moves|moves|transports)\b/g, (m, w) => "1 " + w.slice(0, -1)).replace(/^clear · /, ""); }
const SHORT = {run_short:c => "Run short · remove " + c, workshop_transport:c => "Run short · " + c + " to workshop by transport", p_lend:() => "Borrow a car from the Paris train",
  p_preposition:() => "Pre-position a reserve car at Denderleeuw", detour:c => "Detour via workshop · drop " + c};
function ttl(o){ return o ? (SHORT[o.id] && INC.car ? SHORT[o.id](INC.car) : String(o.title || "").replace(/^PROPOSAL:\s*/, "")) : ""; }
function split(o){ return o.eur == null ? "" : o.eur_assumed ? "ES rates " + eur(o.eur_table) + " · est. " + eur(o.eur_assumed) : "ES rates " + eur(o.eur_table); }
function more(label, hash){ return h("button", {class:"more", text:label + " →", onclick:() => { location.hash = hash; }}); }

/* ---------- scenario clock ---------- */
function tms(t, base){ /* "17:17:00" on the scenario date -> ms; small hours after an evening start roll to the next day */
  if (!t) return null;
  const [H, M, Sx] = t.split(":").map(Number);
  let ms = Date.UTC(...LIVE.date.split("-").map((v,i) => i === 1 ? v - 1 : +v), H, M, Sx || 0);
  if (base != null && ms < base - 6*3600e3) ms += 86400e3;
  return ms;
}
const fmtT = ms => { const d = new Date(ms); return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds()); };
const fmtHM = ms => fmtT(ms).slice(0, 5);
const mins = sec => sec == null ? null : Math.trunc(sec / 60);
const PLAN_DEP = LIVE ? tms(LIVE.planned_dep) : null;
const REAL_DEP = LIVE ? tms(LIVE.points[0].real_dep, PLAN_DEP) : null;
let sim = LIVE ? PLAN_DEP - 25*60e3 : null, rate = 1, lastTick = performance.now(), queue = [];

/* Lines the incident sits on: the incident's own line, else the lines of the trains the cascade names. */
function mineLines(){
  if (INC.line) return new Set([INC.line]);
  const t = affectedTrains(), out = new Set();
  for (const [k, L] of Object.entries(LINES)) if (t.has(L.outbound) || t.has(L.return)) out.add(k);
  return out;
}
function affectedTrains(){
  const t = new Set(arr(D.impact.nodes).filter(n => n.kind === "train").map(n => n.id.replace("train:", "")));
  for (const o of arr(D.options)) if (o.id === D.chosen) for (const st of arr(o.steps)) if (st.train) t.add(st.train);

function makeProj(w, ht){

  const lat0 = all.reduce((a,k) => a + PL[k].lat, 0) / all.length, kx = Math.cos(lat0 * Math.PI / 180);
  const xs = all.map(k => PL[k].lon * kx), ys = all.map(k => -PL[k].lat);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const p = {l:58, r:58, t:22, b:26};
  const sc = Math.min((w-p.l-p.r)/((maxx-minx)||1), (ht-p.t-p.b)/((maxy-miny)||1));
  const ox = p.l + ((w-p.l-p.r) - (maxx-minx)*sc)/2, oy = p.t + ((ht-p.t-p.b) - (maxy-miny)*sc)/2;
  return key => ok(key) ? [ox + (PL[key].lon*kx - minx)*sc, oy + (-PL[key].lat - miny)*sc] : null;
}

      "stroke-width":on ? 5 : 3, "stroke-dasharray":on ? null : tc ? "9 5" : null, "stroke-linejoin":"round", "stroke-linecap":"round"}));

    ev.push([t, "INFRABEL", "Train " + LIVE.train + (i ? " passes " : " leaves ") + p.name + ", planned " + (p.plan_dep || p.plan_arr).slice(0, 5) + " (+" + mins(p.delay_dep_s ?? p.delay_arr_s) + " min)", i === 0]); }
  for (const [no, f] of Object.entries(LIVE.fleet)){ if (no === LIVE.train || !f.first.name.startsWith("Brussel") || !f.first.real_dep) continue; const t = tms(f.first.real_dep, PLAN_DEP);

  const H = 3600e3, t0 = Math.floor((PLAN_DEP - 40*60e3) / H) * H, t1 = Math.ceil(Math.max(...P.map(p => p.re)) / H) * H;
  const x = i => M.l + i * (w - M.l - M.r) / (P.length - 1), y = t => M.t + (Math.min(t1, Math.max(t0, t)) - t0) / (t1 - t0) * (ht - M.t - M.b);
  for (let t = t0; t <= t1; t += H){ svg.append(s("line", {x1:M.l - 4, x2:w - M.r + 30, y1:y(t), y2:y(t), stroke:"#D5D9E0", "stroke-width":1}));
    svg.append(s("text", {x:M.l - 8, y:y(t) + 4, "text-anchor":"end"}, fmtHM(t))); }
  P.forEach((p, i) => { svg.append(s("line", {x1:x(i), x2:x(i), y1:M.t, y2:ht - M.b, stroke:"#A9AFBC", "stroke-width":1}));
    svg.append(s("text", {x:x(i), y:M.t - 12, "text-anchor":"middle"}, p.lab)); });
  svg.append(s("polyline", {points:P.map((p, i) => x(i) + "," + y(p.pa) + " " + x(i) + "," + y(p.pl)).join(" "), fill:"none", stroke:"#475569", "stroke-width":2, "stroke-dasharray":"6 4"}));
  const drawNow = () => { if (sim > t1) return; svg.append(s("line", {x1:M.l - 6, x2:w - M.r + 30, y1:y(sim), y2:y(sim), stroke:"#40002C", "stroke-width":2, "stroke-dasharray":"7 4"}));
    svg.append(s("text", {x:w - M.r + 30, y:y(sim) - 5, "text-anchor":"end", style:"fill:#40002C"}, "NOW " + fmtHM(sim))); };
  if (S.replay){
    const E = P.flatMap((p, i) => i ? [[i, p.ra], [i, p.re]] : [[i, p.re]]);

    svg.append(s("polyline", {points:pts.map(q => q.join(",")).join(" "), fill:"none", stroke:"#C81E1E", "stroke-width":4, "stroke-linejoin":"round", "stroke-linecap":"round"}));
    P.forEach((p, i) => { if (sim < p.ra) return; svg.append(s("circle", {cx:x(i), cy:y(p.ra), r:4, fill:"#fff", stroke:"#1A0A14", "stroke-width":2}));
      if (i === 0 || i === 2 || i === P.length - 1) svg.append(s("text", {x:x(i) + (i === P.length - 1 ? -8 : 8), y:y(p.ra) - 9, "text-anchor":i === P.length - 1 ? "end" : "start", style:"fill:#C81E1E"}, p.rt + " +" + p.d)); });
    if (head) svg.append(s("path", {d:`M${head[0]} ${head[1]-6}l6 6l-6 6l-6-6z`, fill:"#1A0A14"}));
    else if (sim < P[0].re && sim > PLAN_DEP) svg.append(s("text", {x:x(0) + 8, y:y(sim) + 14, style:"fill:#C81E1E"}, "HELD +" + Math.round((sim - PLAN_DEP) / 60e3)));

  svg.append(s("text", {x:x(0) + 9, y:y(PLAN_DEP) - 6, style:"fill:#C81E1E"}, "DECIDE BY " + fmtHM(PLAN_DEP)));
}

function back(){ history.replaceState(null, "", location.pathname + location.search); route(); }

window.addEventListener("hashchange", route);
window.addEventListener("resize", () => { drawMap(); drawTD(); });
window.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" && e.key.startsWith("Arrow")) return;
  if (e.key === "Escape") back();
  else if (document.getElementById("page").classList.contains("on")) return;
  else if (e.key === "ArrowRight" || e.key === "PageDown") setFlow(S.flow + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") setFlow(S.flow - 1);
});
seedLog(); build(); route(); tick(); setInterval(tick, 200);
</script>
